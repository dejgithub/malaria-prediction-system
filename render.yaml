services:
  - type: web
    name: malaria-prediction-api
    env: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 10000
      - key: CORS_ORIGINS
        value: "*"
      - key: API_RATE_LIMIT
        value: "100"
    healthCheckPath: /health
    autoDeploy: true
